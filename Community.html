
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | Ankit Shrestha</title>

<style>
:root {
    --bg: #1d252f;
    --cream: #e7dfcc;
    --muted: #aaa99f;
    --line: rgba(231, 223, 204, 0.22);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--bg);
    color: var(--cream);
    font-family: "Trebuchet MS", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
}

a {
    color: inherit;
    text-decoration: none;
}

/* NAVIGATION */

.site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(29, 37, 47, 0.97);
    border-bottom: 1px solid var(--line);
}

.nav-inner {
    max-width: 1240px;
    margin: auto;
    min-height: 74px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.site-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    white-space: nowrap;
}

.site-name:hover {
    opacity: 0.75;
}

.site-nav {
    display: flex;
    align-items: center;
    gap: 31px;
}

.site-nav a {
    position: relative;
    display: inline-block;
    padding: 27px 0 24px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.3px;
    transition: color 0.2s ease;
}

.site-nav a:hover {
    color: var(--cream);
}

.site-nav a.active {
    color: var(--cream);
}

.site-nav a.active::after {
    content: "";
    position: absolute;
    bottom: 17px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--cream);
}

/* MAIN COMMUNITY CONTENT */

.community-section {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 38px 28px 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* PAGE HEADING */

.community-section h1 {
    margin: 0 0 10px;
    font-size: clamp(29px, 3.4vw, 42px);
    font-weight: 500;
    letter-spacing: 7px;
    text-transform: uppercase;
    line-height: 1.2;

    animation: gentleReveal 0.7s ease-out both;
}

/* ORIGINAL HANDWRITTEN LOGO */

.logo-container {
    width: min(460px, 80vw);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;

    animation: gentleReveal 0.8s ease-out 0.15s both;
}

.logo-container img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* MAILING LIST */

.community-copy {
    width: 100%;
    max-width: 850px;
}

.community-copy p {
    margin: 0 auto 24px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    white-space: nowrap;

    animation: gentleReveal 0.8s ease-out 0.3s both;
}

/* JOIN BUTTON */

.join-button {
    display: inline-block;
    background: var(--cream);
    color: var(--bg);
    padding: 12px 30px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.3px;
    transition: background 0.2s ease;

    animation: gentleReveal 0.8s ease-out 0.45s both;
}

.join-button:hover {
    background: #fff8e8;
}

/* CONTACT */

.contact {
    margin-top: 25px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);

    animation: gentleReveal 0.8s ease-out 0.6s both;
}

.contact a {
    color: var(--cream);
    border-bottom: 1px solid var(--line);
    padding-bottom: 3px;
    transition: border-color 0.2s ease;
}

.contact a:hover {
    border-color: var(--cream);
}

/* ONE-TIME ENTRANCE ANIMATION */

@keyframes gentleReveal {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FOOTER */

footer {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 28px 20px 30px;
    text-align: center;
}

.social-media-icons {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 28px;
}

.social-media-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
}

.social-media-icons img {
    display: block;
    width: 27px;
    height: 27px;
    object-fit: contain;
    transition: opacity 0.2s ease;
}

.social-media-icons a:hover img {
    opacity: 0.65;
}

.footer-name {
    margin: 17px 0 0;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
}

/* TABLET */

@media (max-width: 900px) {

    .nav-inner {
        gap: 18px;
    }

    .site-nav {
        gap: 17px;
    }

    .site-nav a {
        font-size: 12px;
    }

    .logo-container {
        width: min(420px, 80vw);
    }

    .community-copy p {
        font-size: 14px;
    }
}

/* MOBILE */

@media (max-width: 650px) {

    .nav-inner {
        min-height: auto;
        padding: 15px 18px 0;
        flex-direction: column;
        gap: 10px;
    }

    .site-name {
        font-size: 15px;
    }

    .site-nav {
        width: 100%;
        justify-content: space-between;
        gap: 12px;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .site-nav::-webkit-scrollbar {
        display: none;
    }

    .site-nav a {
        flex-shrink: 0;
        padding: 8px 0 15px;
        font-size: 12px;
    }

    .site-nav a.active::after {
        bottom: 7px;
    }

    .community-section {
        padding: 28px 20px 35px;
    }

    .community-section h1 {
        font-size: 29px;
        letter-spacing: 5px;
        margin-bottom: 10px;
    }

    .logo-container {
        width: min(340px, 83vw);
        margin-bottom: 6px;
    }

    .community-copy p {
        font-size: 13px;
        line-height: 1.6;
        white-space: normal;
        margin-bottom: 20px;
    }

    .join-button {
        padding: 12px 25px;
        font-size: 11px;
    }

    .contact {
        margin-top: 20px;
        font-size: 11px;
    }

    .social-media-icons {
        gap: 20px;
    }
}

/* SHORT SCREENS */

@media (max-height: 720px) {

    .community-section {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .community-section h1 {
        margin-bottom: 6px;
    }

    .logo-container {
        width: min(340px, 70vw);
        margin-bottom: 4px;
    }

    .community-copy p {
        margin-bottom: 15px;
    }

    .contact {
        margin-top: 15px;
    }

    footer {
        padding-top: 18px;
        padding-bottom: 18px;
    }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    .community-section h1,
    .logo-container,
    .community-copy p,
    .join-button,
    .contact {
        animation: none;
    }
}
</style>
</head>
