
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community | Ankit Shrestha</title>

    <style>
        :root {
            --bg: #1d252f;
            --cream: #e7dfcc;
            --muted: #aaa99f;
            --line: rgba(231, 223, 204, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            background: var(--bg);
            color: var(--cream);
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* PAGE LAYOUT */

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        /* HOME BUTTON */

        .home-button {
            position: absolute;
            top: 28px;
            left: 5%;
            z-index: 10;
        }

        .home-button a {
            display: inline-block;
            border: 1px solid var(--cream);
            border-radius: 3px;
            padding: 8px 22px;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background 0.2s ease,
                        color 0.2s ease;
        }

        .home-button a:hover {
            background: var(--cream);
            color: var(--bg);
        }

        /* MAIN CONTENT */

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 90px 24px 35px;
        }

        /* PAGE TITLE */

        .page-title {
            font-size: clamp(30px, 4vw, 42px);
            font-weight: 500;
            letter-spacing: 9px;
            margin: 0 0 35px;
        }

        /* ORIGINAL LOGO */

        .logo-container {
            width: min(460px, 80vw);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 35px;
        }

        .logo-container img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* COMMUNITY COPY */

        .community-copy {
            max-width: 520px;
        }

        .community-copy p {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.85;
            color: var(--muted);
            margin: 0 auto 27px;
        }

        /* JOIN BUTTON */

        .join-button {
            display: inline-block;
            background: var(--cream);
            color: var(--bg);
            border: 1px solid var(--cream);
            border-radius: 3px;
            padding: 14px 35px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            transition: background 0.25s ease,
                        color 0.25s ease;
        }

        .join-button:hover {
            background: transparent;
            color: var(--cream);
        }

        /* CONTACT */

        .contact {
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        .contact a {
            color: var(--cream);
            border-bottom: 1px solid var(--line);
            padding-bottom: 3px;
            transition: border-color 0.2s ease;
        }

        .contact a:hover {
            border-color: var(--cream);
        }

        /* FOOTER */

        footer {
            padding: 25px 20px 35px;
            text-align: center;
        }

        footer::before {
            content: "";
            display: block;
            width: min(420px, 75%);
            height: 1px;
            background: var(--line);
            margin: 0 auto 27px;
        }

        .social-media-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .social-media-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            transition: opacity 0.2s ease;
        }

        .social-media-icons img {
            display: block;
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .social-media-icons a:hover {
            opacity: 0.65;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .home-button {
                top: 20px;
                left: 22px;
            }

            .home-button a {
                padding: 7px 17px;
                font-size: 12px;
            }

            main {
                padding: 85px 22px 20px;
            }

            .page-title {
                font-size: 29px;
                letter-spacing: 6px;
                margin-bottom: 25px;
            }

            .logo-container {
                width: min(340px, 83vw);
                margin-bottom: 25px;
            }

            .community-copy p {
                font-size: 14px;
                line-height: 1.7;
                margin-bottom: 22px;
            }

            .join-button {
                padding: 13px 25px;
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            .contact {
                margin-top: 22px;
                font-size: 11px;
            }

            footer {
                padding: 15px 12px 22px;
            }

            footer::before {
                margin-bottom: 18px;
            }

            .social-media-icons {
                gap: 14px;
            }

            .social-media-icons a {
                width: 38px;
                height: 38px;
            }

            .social-media-icons img {
                width: 30px;
                height: 30px;
            }
        }

        /* SHORT SCREENS */

        @media (max-height: 720px) {

            main {
                padding-top: 70px;
                padding-bottom: 12px;
            }

            .page-title {
                margin-bottom: 18px;
            }

            .logo-container {
                width: min(340px, 70vw);
                margin-bottom: 18px;
            }

            .community-copy p {
                margin-bottom: 16px;
            }

            .contact {
                margin-top: 16px;
            }

            footer {
                padding-top: 10px;
                padding-bottom: 15px;
            }

            footer::before {
                margin-bottom: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- HOME -->
        <nav class="home-button">
            <a href="index.html">Home</a>
        </nav>

        <!-- MAIN -->
        <main>

            <h1 class="page-title">
                COMMUNITY
            </h1>

            <!-- ORIGINAL LOGO -->
            <div class="logo-container">
                <img
                    src="Name Logo.png"
                    alt="Ankit Shrestha"
                >
            </div>

            <!-- MAILING LIST -->
            <div class="community-copy">

                <p>
                    Join the mailing list for new music,
                    upcoming shows, and occasional updates.
                </p>

                <a
                    class="join-button"
                    href="https://docs.google.com/forms/d/e/1FAIpQLSdQg2vs9KaWiMHX-tBqh1cNb_tsnM44Z4mcUuKVdnmabEOeUg/viewform"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    JOIN THE COMMUNITY
                </a>

                <div class="contact">
                    For bookings, collaborations & inquiries:
                    <a href="mailto:management.ankitshrestha@gmail.com">
                        Get in touch
                    </a>
                </div>

            </div>

        </main>

        <!-- FOOTER -->
        <footer>

            <div class="social-media-icons">

                <a href="mailto:management.ankitshrestha@gmail.com"
                   aria-label="Email">
                    <img src="Mail.png" alt="Email">
                </a>

                <a href="https://instagram.com/ankit_shrestha_"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Instagram">
                    <img src="Instagram.png" alt="Instagram">
                </a>

                <a href="https://facebook.com/ankitshresthamusic"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Facebook">
                    <img src="Facebook.png" alt="Facebook">
                </a>

                <a href="https://open.spotify.com/artist/3CKS9fPsTBBcQoneFUkPu5"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Spotify">
                    <img src="Spotify.png" alt="Spotify">
                </a>

                <a href="https://music.apple.com/gb/artist/ankit-shrestha/1142449792"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Apple Music">
                    <img src="Apple.png" alt="Apple Music">
                </a>

                <a href="https://youtube.com/ankitshrestha"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="YouTube">
                    <img src="Youtube.png" alt="YouTube">
                </a>

            </div>

        </footer>

    </div>

</body>
</html>
