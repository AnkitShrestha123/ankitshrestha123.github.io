
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Videos | Ankit Shrestha</title>

    <style>
        :root {
            --bg: #1d252f;
            --cream: #e7dfcc;
            --muted: #aaa99f;
            --line: rgba(231, 223, 204, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--cream);
            font-family: "Trebuchet MS", Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Home navigation */

        .home-button {
            position: absolute;
            top: 28px;
            left: 5%;
            z-index: 2;
        }

        .home-button a {
            display: inline-block;
            border: 1px solid var(--cream);
            border-radius: 3px;
            padding: 8px 22px;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.2s ease;
        }

        .home-button a:hover {
            background: var(--cream);
            color: var(--bg);
        }

        /* Main section */

        .video-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 105px 35px 95px;
            flex: 1;
        }

        /* Page heading */

        .video-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 20px;
        }

        .video-header h1 {
            font-size: 38px;
            font-weight: 500;
            letter-spacing: 9px;
            margin: 0;
            text-transform: uppercase;
        }

        .header-icon img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: block;
        }

        /* Watch all button */

        .watch-all {
            text-align: center;
            margin-bottom: 75px;
        }

        .watch-button {
            display: inline-block;
            background: var(--cream);
            color: var(--bg);
            padding: 12px 32px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.2s ease;
        }

        .watch-button:hover {
            background: white;
            transform: translateY(-2px);
        }

        /* Gallery heading */

        .gallery-heading {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .gallery-heading h2 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 3px;
            margin: 0;
        }

        .gallery-heading::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--line);
        }

        /* Video gallery */

        .video-gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 26px;
            row-gap: 42px;
        }

        .video-card {
            min-width: 0;
        }

        .video-card a {
            display: block;
        }

        /* Thumbnail */

        .thumbnail {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #141b24;
            border: 1px solid var(--line);
        }

        .thumbnail img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease,
                        filter 0.4s ease;
        }

        .video-card:hover .thumbnail img {
            transform: scale(1.04);
            filter: brightness(0.8);
        }

        /* Minimal play symbol */

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            background: rgba(20, 25, 32, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .play-icon::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 10px solid var(--cream);
            margin-left: 3px;
        }

        .video-card:hover .play-icon,
        .video-card a:focus-visible .play-icon {
            opacity: 1;
        }

        /* Video title */

        .video-title {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin: 13px 0 0;
            line-height: 1.5;
            transition: color 0.2s ease;
        }

        .video-card:hover .video-title {
            color: white;
        }

        /* Footer */

        footer {
            border-top: 1px solid var(--line);
            padding: 35px 20px 45px;
            text-align: center;
        }

        .social-media-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 28px;
        }

        .social-media-icons img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            transition: opacity 0.2s ease;
        }

        .social-media-icons a:hover img {
            opacity: 0.65;
        }

        .footer-name {
            margin-top: 25px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--muted);
        }

        /* Tablet */

        @media (max-width: 900px) {
            .video-gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 35px 22px;
            }

            .video-section {
                padding: 110px 30px 75px;
            }
        }

        /* Mobile */

        @media (max-width: 600px) {
            .home-button {
                top: 20px;
                left: 22px;
            }

            .video-section {
                padding: 110px 22px 65px;
            }

            .video-header {
                gap: 14px;
            }

            .video-header h1 {
                font-size: 27px;
                letter-spacing: 5px;
            }

            .header-icon img {
                width: 48px;
                height: 48px;
            }

            .watch-all {
                margin-bottom: 60px;
            }

            .video-gallery {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .video-title {
                font-size: 16px;
            }

            .gallery-heading h2 {
                font-size: 19px;
            }

            .social-media-icons {
                gap: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .thumbnail img,
            .play-icon,
            .watch-button {
                transition: none;
            }
        }
    </style>
</head>
